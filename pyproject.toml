[project]
name = "toolbx"
version = "0.4.0"
description = "Provider-neutral Python SDK for LLM tools with typed toolsets, schema exports, validation, async execution, and middleware"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
]
keywords = [
    "llm",
    "agents",
    "tool-calling",
    "function-calling",
    "json-schema",
    "pydantic",
    "asyncio",
    "middleware",
]
# No License classifier: PEP 639 forbids it next to a license expression.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pydantic :: 2",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mathisarends/toolbx"
Repository = "https://github.com/mathisarends/toolbx"
Issues = "https://github.com/mathisarends/toolbx/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
py-llmify = [
    "py-llmify[openai]==0.9.0",
]

[tool.uv]
default-groups = ["dev", "py-llmify"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolbx"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=toolbx",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
asyncio_mode = "strict"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["toolbx"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
